name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity中文助手
          path: dist/Antigravity中文助手.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem -LiteralPath "dist" -Filter "*.exe" | Select-Object -First 1
          if (-not $asset) { throw "Release executable was not found." }
          $releaseAsset = Join-Path "dist" "AntigravityZhAssistant.exe"
          Copy-Item -LiteralPath $asset.FullName -Destination $releaseAsset -Force
          gh release create "${{ github.ref_name }}" $releaseAsset --generate-notes --title "Antigravity Chinese Assistant ${{ github.ref_name }}"
