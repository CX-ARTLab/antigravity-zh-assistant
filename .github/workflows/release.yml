name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Package portable ZIP
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "AntigravityZhAssistant"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath "dist\AntigravityZhAssistant.exe" -Destination $stage
          Copy-Item -LiteralPath "README.md" -Destination $stage
          Copy-Item -LiteralPath "LICENSE" -Destination $stage
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "dist\AntigravityZhAssistant-windows.zip" -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityZhAssistant-windows
          path: dist/AntigravityZhAssistant-windows.zip

  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            architecture: intel
          - runner: macos-14
            architecture: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app and ZIP
        shell: bash
        run: bash macOS/build-macos.sh
      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityZhAssistant-macOS-${{ matrix.architecture }}
          path: dist/AntigravityZhAssistant-macOS-${{ matrix.architecture }}.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip --generate-notes --title "Antigravity Chinese Assistant ${{ github.ref_name }}"
