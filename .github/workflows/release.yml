name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity中文助手
          path: dist/Antigravity中文助手.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/Antigravity中文助手.exe" --generate-notes --title "Antigravity 中文助手 ${{ github.ref_name }}"
